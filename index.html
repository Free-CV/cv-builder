<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع السيرة الذاتية - ATS Format</title>
    <!-- خطوط جوجل الاحترافية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة تحويل HTML إلى Word -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.js"></script>
</head>
<body>

    <header class="main-header">
        <div class="header-title">
            <h1>صانع السير الذاتية (ATS Format)</h1>
        </div>
        <!-- خيار اختيار اللغة -->
        <div class="lang-selector">
            <button onclick="setLanguage('ar')" id="btnAr" class="lang-btn active-lang">العربية</button>
            <button onclick="setLanguage('en')" id="btnEn" class="lang-btn">English</button>
        </div>
    </header>

    <div class="container">
        <!-- قسم إدخال البيانات -->
        <section class="form-section">
            <h2 id="lblPersonal">البيانات الشخصية</h2>
            <div class="form-group"><label id="lblFullName">الاسم الكامل</label><input type="text" id="fullName" placeholder="" oninput="updateCV()"></div>
            <div class="form-group"><label id="lblJobTitle">المسمى الوظيفي</label><input type="text" id="jobTitle" placeholder="" oninput="updateCV()"></div>
            <div class="form-group"><label id="lblEmail">البريد الإلكتروني</label><input type="email" id="email" placeholder="" oninput="updateCV()"></div>
            <div class="form-group"><label id="lblLinkedin">رابط LinkedIn</label><input type="text" id="linkedin" placeholder="" oninput="updateCV()"></div>
            <div class="form-group"><label id="lblPhone">الهاتف</label><input type="text" id="phone" placeholder="" oninput="updateCV()"></div>
            <div class="form-group"><label id="lblLocation">المدينة والبلد</label><input type="text" id="location" placeholder="" oninput="updateCV()"></div>

            <h2 id="lblSummaryTitle">الملخص المهني</h2>
            <div class="form-group"><textarea id="summary" rows="3" placeholder="" oninput="updateCV()"></textarea></div>

            <h2 id="lblExpTitle">الخبرات العملية</h2>
            <div class="form-group"><textarea id="experience" rows="5" placeholder="" oninput="updateCV()"></textarea></div>

            <h2 id="lblSkillsTitle">المهارات</h2>
            <div class="form-group"><textarea id="skills" rows="3" placeholder="" oninput="updateCV()"></textarea></div>

            <h2 id="lblEduTitle">التعليم</h2>
            <div class="form-group"><textarea id="education" rows="3" placeholder="" oninput="updateCV()"></textarea></div>
        </section>

        <!-- قسم المعاينة والتصدير -->
        <section class="preview-section">
            <div class="actions-bar">
                <button id="downloadPdfBtn" class="action-btn pdf-btn" onclick="window.print()">
                    📥 تحميل PDF
                </button>
                <button id="downloadWordBtn" class="action-btn word-btn" onclick="exportToWord()">
                    📝 تحميل Word
                </button>
            </div>
            
            <div class="cv-card-wrapper">
                <div class="cv-page ats-template" id="cvPreview">
                    <header class="ats-header">
                        <h1 id="cvName"></h1>
                        <div id="cvJobTitle" class="ats-subtitle"></div>
                        <div class="ats-contact" id="cvContactBar"></div>
                    </header>

                    <div class="ats-grid">
                        <div class="ats-main">
                            <section class="ats-section" id="secSummary">
                                <h2 id="headSummary">الملخص المهني</h2>
                                <p id="cvSummary"></p>
                            </section>

                            <section class="ats-section" id="secExp">
                                <h2 id="headExp">الخبرات العملية</h2>
                                <div id="cvExperience" class="ats-formatted-text"></div>
                            </section>
                        </div>

                        <div class="ats-sidebar">
                            <section class="ats-section" id="secSkills">
                                <h2 id="headSkills">المهارات</h2>
                                <ul id="cvSkills"></ul>
                            </section>

                            <section class="ats-section" id="secEdu">
                                <h2 id="headEdu">التعليم</h2>
                                <div id="cvEducation" class="ats-formatted-text"></div>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
