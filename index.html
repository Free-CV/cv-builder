<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع السيرة الذاتية الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة تحويل HTML إلى Word -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.js"></script>
</head>
<body>

    <header class="main-header">
        <h1>صانع السير الذاتية - ATS Format</h1>
        <!-- خيار اختيار اللغة -->
        <div class="lang-selector">
            <button onclick="setLanguage('ar')" id="btnAr" class="active-lang">العربية</button>
            <button onclick="setLanguage('en')" id="btnEn">English</button>
        </div>
    </header>

    <div class="container">
        <!-- قسم إدخال البيانات -->
        <section class="form-section">
            <h2 id="lblPersonal">البيانات الشخصية</h2>
            <div class="form-group"><label id="lblFullName">الاسم الكامل</label><input type="text" id="fullName" oninput="updateCV()"></div>
            <div class="form-group"><label id="lblJobTitle">المسمى الوظيفي</label><input type="text" id="jobTitle" oninput="updateCV()"></div>
            <div class="form-group"><label id="lblEmail">البريد الإلكتروني</label><input type="email" id="email" oninput="updateCV()"></div>
            <div class="form-group"><label id="lblLinkedin">رابط LinkedIn</label><input type="text" id="linkedin" oninput="updateCV()"></div>
            <div class="form-group"><label id="lblPhone">الهاتف</label><input type="text" id="phone" oninput="updateCV()"></div>
            <div class="form-group"><label id="lblLocation">المدينة والبلد</label><input type="text" id="location" oninput="updateCV()"></div>

            <h2 id="lblSummaryTitle">الملخص المهني</h2>
            <div class="form-group"><textarea id="summary" rows="3" oninput="updateCV()"></textarea></div>

            <h2 id="lblExpTitle">الخبرات العملية</h2>
            <div class="form-group"><textarea id="experience" rows="6" oninput="updateCV()"></textarea></div>

            <h2 id="lblSkillsTitle">المهارات</h2>
            <div class="form-group"><textarea id="skills" rows="4" oninput="updateCV()"></textarea></div>

            <h2 id="lblEduTitle">التعليم</h2>
            <div class="form-group"><textarea id="education" rows="4" oninput="updateCV()"></textarea></div>
        </section>

        <!-- قسم المعاينة والتصدير -->
        <section class="preview-section">
            <div class="actions-bar">
                <button id="downloadPdfBtn" onclick="window.print()">تحميل PDF</button>
                <button id="downloadWordBtn" onclick="exportToWord()">تحميل Word</button>
            </div>
            
            <div class="cv-page ats-template" id="cvPreview">
                <header class="ats-header">
                    <h1 id="cvName">FULL NAME</h1>
                    <div id="cvJobTitle" class="ats-subtitle">Target Job Title</div>
                    <div class="ats-contact">
                        <span id="cvEmail">email@example.com</span> • 
                        <span id="cvLinkedin">linkedin.com/in/username</span> • 
                        <span id="cvPhone">+123456789</span> • 
                        <span id="cvLocation">City, Country</span>
                    </div>
                </header>

                <div class="ats-grid">
                    <div class="ats-main">
                        <section class="ats-section">
                            <h2 id="headSummary">SUMMARY</h2>
                            <p id="cvSummary">Professional summary...</p>
                        </section>

                        <section class="ats-section">
                            <h2 id="headExp">WORK EXPERIENCE</h2>
                            <div id="cvExperience" class="ats-formatted-text"></div>
                        </section>
                    </div>

                    <div class="ats-sidebar">
                        <section class="ats-section">
                            <h2 id="headSkills">SKILLS</h2>
                            <ul id="cvSkills"></ul>
                        </section>

                        <section class="ats-section">
                            <h2 id="headEdu">EDUCATION</h2>
                            <div id="cvEducation" class="ats-formatted-text"></div>
                        </section>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
